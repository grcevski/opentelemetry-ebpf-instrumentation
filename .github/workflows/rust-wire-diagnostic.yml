name: Rust HTTP1 wire diagnostic
on:
  push:
    branches: [diagnose/rust-wire-4310]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rustc: ["1.97.1", "1.98.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 44837072150
          name: bpf-generated-44837072150
      - name: Install compiler
        env:
          RUST_COMPILER: ${{ matrix.rustc }}
        run: rustup toolchain install "$RUST_COMPILER" --profile minimal
      - name: Verify the direct client with its normal allocator
        env:
          OBI_RUST_TEST_DEBUG: "1"
          RUST_COMPILER: ${{ matrix.rustc }}
        run: python3 scripts/test-rust-context.py --work-dir "$RUNNER_TEMP/rust-context" --toolchain "$RUST_COMPILER" --protocols --live --container --case rustls-direct-client-0.22 --scenario rustls-direct-client-0.22
      - name: Leave 64 resident bytes at the start of Hyper's buffer
        run: |
          sed 's/BOUNDARY: usize = 112/BOUNDARY: usize = 64/' scripts/rust-wire-diagnostic-allocator.rs >> internal/test/integration/components/rustcontext/src/main.rs
      - name: Verify that a longer request recovers on the same TLS connection
        env:
          OBI_RUST_TEST_DEBUG: "1"
          RUST_COMPILER: ${{ matrix.rustc }}
        run: |
          python3 scripts/test-rust-context.py --work-dir "$RUNNER_TEMP/rust-context" --toolchain "$RUST_COMPILER" --protocols --live --container --case rustls-direct-client-0.22 --scenario rustls-direct-client-0.22
          grep -h -m1 'rust h1 append dst=.*err=-14' "$RUNNER_TEMP"/rust-context/evidence/"$RUST_COMPILER"/*/*.log
          grep -h -m1 'wire injection skipped 1/10 requests' "$RUNNER_TEMP"/rust-context/evidence/"$RUST_COMPILER"/*/*.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rust-wire-cold-${{ matrix.rustc }}
          path: ${{ runner.temp }}/rust-context/evidence/
