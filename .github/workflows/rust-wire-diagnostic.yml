name: Rust HTTP1 wire diagnostic
on:
  push:
    branches: [diagnose/rust-wire-4310]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          repository: open-telemetry/opentelemetry-ebpf-instrumentation
          run-id: 44829153041
          name: bpf-generated-44829153041
      - name: Install compiler
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Capture original HTTP/1 probe results
        id: original
        continue-on-error: true
        env:
          OBI_RUST_TEST_DEBUG: "1"
        run: python3 scripts/test-rust-context.py --work-dir "$RUNNER_TEMP/rust-context" --toolchain 1.97.1 --protocols --live --container --case rustls-direct-client-0.22 --scenario rustls-direct-client-0.22
      - name: Check initialized fixture allocations
        env:
          OBI_RUST_TEST_DEBUG: "1"
        shell: bash
        run: |
          set -eu
          sed -i '/cmd.Env = os.Environ()/a\  cmd.Env = append(cmd.Env, "MALLOC_PERTURB_=165")' pkg/internal/ebpf/generictracer/rust_privileged_test.go
          python3 scripts/test-rust-context.py --work-dir "$RUNNER_TEMP/rust-context" --toolchain 1.97.1 --protocols --live --container --case rustls-direct-client-0.22 --scenario rustls-direct-client-0.22
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rust-http1-probe-evidence
          path: ${{ runner.temp }}/rust-context/evidence/
      - name: Report original outcome
        if: always()
        env:
          ORIGINAL: ${{ steps.original.outcome }}
        run: echo "Original wire test result $ORIGINAL"
