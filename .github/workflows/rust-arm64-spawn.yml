name: Rust arm64 spawn verification
on:
  push:
    branches: [diagnose/rust-arm64-spawn-4310]
permissions:
  contents: read
  actions: read
jobs:
  rust-context:
    name: Rust context (1.100.0, arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      OBI_RUST_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: open-telemetry/opentelemetry-ebpf-instrumentation
          github-token: ${{ github.token }}
          run-id: 44853648708
          name: bpf-generated-44853648708
      - name: Cache Cargo dependencies and fixture builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] Cargo validates registry checksums and compiler fingerprints
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/rust-context/target
          key: rust-context-arm64-1.100.0-${{ hashFiles('configs/offsets/rust_versions.json', 'internal/test/integration/components/rustcontext/Cargo.toml', 'scripts/rust_context.py') }}
          restore-keys: |
            rust-context-arm64-1.100.0-
      - name: Install Rust compiler
        run: rustup toolchain install "$OBI_RUST_TOOLCHAIN" --profile minimal
      - name: Validate offset tooling
        run: make test-rust-offsets
      - name: Check shared socket injection regressions
        shell: bash
        run: |
          mkdir -p testoutput
          CGO_ENABLED=0 go test -c -tags=privileged_tests -o "$RUNNER_TEMP/tpinjector.test" ./pkg/internal/ebpf/tpinjector
          sudo "$RUNNER_TEMP/tpinjector.test" -test.v -test.timeout=10m -test.run='^Test(H2|HTTP1|OutgoingContext|OTelTraceExport)' | tee testoutput/rust-socket-regressions.log
      - name: Run Rust protocol and fallback integration tests
        env:
          OBI_RUST_TEST_DEBUG: "1"
          OBI_RUST_WORK_DIR: ${{ runner.temp }}/rust-context
        run: go test -v -count=1 -run '^TestRustContextPropagationMatrix$' -timeout 45m ./internal/test/integration/rustcontext
      - name: Upload Rust evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-context-1.100.0-arm64
          path: |
            testoutput/rust-context-*.log
            testoutput/rust-socket-*.log
            ${{ runner.temp }}/rust-context/evidence/
          retention-days: 14
